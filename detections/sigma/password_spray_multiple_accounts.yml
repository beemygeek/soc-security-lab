title: Failed Network or RDP Logon
id: 4b7e1d2a-9c3f-4e8a-b6d1-2f5a7c9e0b13
name: failed_remote_logon
status: experimental
description: Base rule for the password-spray correlation below. Failed network/RDP logons from a remote source.
author: Bee (beemygeek)
date: 2026-10-19
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    LogonType:
      - 3   # network
      - 10  # remote interactive (RDP)
  filter_local:
    IpAddress:
      - '-'
      - '127.0.0.1'
      - '::1'
  condition: selection and not filter_local
falsepositives:
  - Users mistyping passwords (alone this rule is noisy; use the correlation)
level: low
---
title: Password Spray - One Source Failing Against Many Accounts
id: 6f1a8c3d-2b5e-4d97-a0c8-1e4b7d9f3a62
status: experimental
description: |
  A single source IP producing failed logons for more than 10 distinct accounts within
  30 minutes - the signature of password spraying (one or two common passwords tried
  across many users to stay under lockout thresholds).
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Bee (beemygeek)
date: 2026-10-19
tags:
  - attack.credential_access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - failed_remote_logon
  group-by:
    - IpAddress
  timespan: 30m
  condition:
    field: TargetUserName
    gt: 10
falsepositives:
  - Misconfigured service or scanner using stale credentials for many accounts
  - Shared kiosk / terminal server where many users mistype passwords
level: high
