title: Suspicious Encoded PowerShell Command Line
id: 8d2c5f1e-3a7b-4c90-9e12-6b4d8f0a2c57
status: experimental
description: |
  Detects PowerShell launched with an encoded command, often combined with hidden
  window / no profile / bypass flags. Attackers and commodity malware use -EncodedCommand
  to hide payloads from casual inspection and simple string matching.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: Bee (beemygeek)
date: 2026-10-19
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_enc:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -ec '
      - ' -e JAB'
      - ' -e SQB'
      - ' -e SUVY'
  selection_stealth:
    CommandLine|contains:
      - '-w hidden'
      - '-windowstyle hidden'
      - '-nop'
      - '-noprofile'
      - 'bypass'
  condition: all of selection_img* and selection_enc and selection_stealth
fields:
  - ParentImage
  - CommandLine
  - User
falsepositives:
  - Some management agents (SCCM/MECM, RMM tools) launch encoded commands; baseline parent processes and exclude known-good ones
level: high
